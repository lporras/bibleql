name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # The published API reference at docs.bibleql.org is generated from
  # docs/generated/schema.graphql, which is committed. This job fails a PR that
  # changes app/graphql/** without regenerating it, so the docs can never
  # describe a schema that isn't deployed.
  #
  # BibleqlSchema.to_definition is static printing: no database service, no
  # submodule checkout and no master key required.
  schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check the SDL is committed and tracked
        run: |
          if ! git ls-files --error-unmatch docs/generated/schema.graphql > /dev/null 2>&1; then
            echo "::error file=docs/generated/schema.graphql::The GraphQL SDL is not tracked by git. Run 'bundle exec rake docs:schema' and commit the result — the docs build reads it from the repository."
            exit 1
          fi

      - name: Export the GraphQL schema
        run: bundle exec rake docs:schema

      # `git diff --exit-code` returns 0 for an untracked file, which would let a
      # deleted SDL pass silently — hence the tracked check above and
      # `git status --porcelain` here, which reports modified and untracked alike.
      - name: Check the committed SDL is up to date
        run: |
          if [ -n "$(git status --porcelain docs/generated/schema.graphql)" ]; then
            echo "::error file=docs/generated/schema.graphql::The committed GraphQL SDL is stale. Run 'bundle exec rake docs:schema' and commit the result."
            git --no-pager diff -- docs/generated/schema.graphql
            exit 1
          fi
          echo "docs/generated/schema.graphql matches app/graphql/"

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      # db/open-bibles is the only git submodule specs need. (Holy-Bible-XML-Format
      # is a separate, 1000+ file source that's deliberately NOT a submodule — see
      # docs/holy-bible-xml-identifiers.md — so there's nothing to init for it here.)
      - name: Check out open-bibles submodule
        run: git submodule update --init --depth=1 db/open-bibles

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/.resultset.json
          token: ${{ secrets.CODECOV_TOKEN }}
